name: production-like

services:
  traefik:
    image: traefik:v3.5.0
    command: ["--api.dashboard=true", "--api.insecure=true", "--providers.docker=true", "--providers.docker.exposedbydefault=false", "--entrypoints.web.address=:80", "--entrypoints.websecure.address=:443", "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-ops@example.com}", "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json", "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web", "--metrics.prometheus=true", "--accesslog=true"]
    ports: ["80:80", "443:443", "127.0.0.1:8080:8080"]
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro, ./letsencrypt:/letsencrypt]
    networks: [public, private]
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-production-like-frontend:v2}
    labels:
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: Host(`${APP_DOMAIN:-localhost}`)
      traefik.http.routers.frontend.entrypoints: web
      traefik.http.routers.frontend-secure.rule: Host(`${APP_DOMAIN:-localhost}`)
      traefik.http.routers.frontend-secure.entrypoints: websecure
      traefik.http.routers.frontend-secure.tls.certresolver: letsencrypt
      traefik.http.services.frontend.loadbalancer.server.port: "80"
    networks: [public]
    restart: unless-stopped

  api1: &api
    build: ./api
    image: ${API_IMAGE:-production-like-api:v2}
    environment: &api-environment
      REDIS_URL: redis://redis:6379/0
      MYSQL_HOST: mysql-router
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      API_KEY: ${API_KEY:-demo-key}
    labels: &api-labels
      traefik.enable: "true"
      traefik.http.routers.api.rule: Host(`${APP_DOMAIN:-localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.api.entrypoints: web
      traefik.http.routers.api-secure.rule: Host(`${APP_DOMAIN:-localhost}`) && PathPrefix(`/api`)
      traefik.http.routers.api-secure.entrypoints: websecure
      traefik.http.routers.api-secure.tls.certresolver: letsencrypt
      traefik.http.middlewares.api-rate-limit.ratelimit.average: "100"
      traefik.http.middlewares.api-rate-limit.ratelimit.period: 1m
      traefik.http.middlewares.api-rate-limit.ratelimit.burst: "20"
      traefik.http.middlewares.api-security.forwardauth.address: http://ip-blocker:8081/check
      traefik.http.middlewares.api-security.forwardauth.trustForwardHeader: "true"
      traefik.http.routers.api.middlewares: api-security,api-rate-limit
      traefik.http.routers.api-secure.middlewares: api-security,api-rate-limit
      traefik.http.services.api.loadbalancer.server.port: "8000"
    networks: [public, private]
    depends_on:
      redis: {condition: service_healthy}
      mysql-router: {condition: service_started}
      ip-blocker: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api2:
    <<: *api
    environment: *api-environment
    labels: *api-labels

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, yes]
    volumes: [redis-data:/data]
    networks: [private]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 5}
    restart: unless-stopped

  mysql-primary:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command: [--server-id=1, --log-bin=mysql-bin, --binlog-format=ROW, --gtid-mode=ON, --enforce-gtid-consistency=ON, --log-replica-updates=ON]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    volumes: [mysql-primary-data:/var/lib/mysql, ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mysql-replica:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command: [--server-id=2, --relay-log=relay-bin, --read-only=ON, --gtid-mode=ON, --enforce-gtid-consistency=ON]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    volumes: [mysql-replica-data:/var/lib/mysql, ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mysql-replication-init:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
      MYSQL_USER: ${MYSQL_USER:-app}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-change-replication-me}
    volumes: [./mysql/replication-init.sh:/replication-init.sh:ro]
    networks: [private]
    depends_on:
      mysql-primary: {condition: service_healthy}
      mysql-replica: {condition: service_healthy}
    entrypoint: [/bin/sh, /replication-init.sh]
    restart: "no"

  mysql-router:
    image: haproxy:3.2-alpine
    volumes: [./mysql/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro]
    networks: [private]
    depends_on: [mysql-primary, mysql-replica]
    restart: unless-stopped

  mysql-backup:
    image: mysql:8.4
    environment:
      MYSQL_HOST: mysql-router
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    volumes: [./backups:/backups, ./scripts/backup.sh:/backup.sh:ro]
    networks: [private]
    depends_on: {mysql-primary: {condition: service_healthy}}
    entrypoint: [/bin/sh, /backup.sh]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro, prometheus-data:/prometheus]
    networks: [private]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes: [./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    networks: [private]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-grafana-me}
    volumes: [grafana-data:/var/lib/grafana]
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`grafana.${APP_DOMAIN:-localhost}`)
      traefik.http.routers.grafana.entrypoints: web
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    networks: [public, private]
    depends_on: [prometheus, loki]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: [-config.file=/etc/loki/config.yml]
    volumes: [./monitoring/loki.yml:/etc/loki/config.yml:ro, loki-data:/loki]
    networks: [private]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.5.0
    command: [-config.file=/etc/promtail/config.yml]
    volumes: [./monitoring/promtail.yml:/etc/promtail/config.yml:ro, /var/lib/docker/containers:/var/lib/docker/containers:ro, /var/run/docker.sock:/var/run/docker.sock:ro]
    networks: [private]
    depends_on: [loki]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: [--path.rootfs=/host]
    volumes: [/:/host:ro,rslave]
    networks: [private]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    privileged: true
    volumes: [/:/rootfs:ro, /var/run:/var/run:ro, /sys:/sys:ro, /var/lib/docker/:/var/lib/docker:ro]
    networks: [private]
    restart: unless-stopped

  ip-blocker:
    image: ${IP_BLOCKER_IMAGE:-production-like-ip-blocker:v2}
    build: ./security
    environment:
      BLOCKED_IPS: ${BLOCKED_IPS:-203.0.113.10,198.51.100.25}
    networks: [private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: ${MYSQL_USER:-app}:${MYSQL_PASSWORD:-change-me}@(mysql-router:3306)/
    networks: [private]
    depends_on: [mysql-router]
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    volumes: [./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro]
    networks: [private]
    restart: unless-stopped

  load-test:
    image: grafana/k6:0.52.0
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      API_KEY: ${API_KEY:-demo-key}
    volumes: [./load-test:/scripts:ro]
    networks: [public]
    profiles: [load-test]
    entrypoint: [k6, run, /scripts/api.js]

networks:
  public: {}
  private: {internal: true}

volumes:
  redis-data: {}
  mysql-primary-data: {}
  mysql-replica-data: {}
  prometheus-data: {}
  grafana-data: {}
  loki-data: {}
